services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wiki
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # Nur lokal erreichbar - niemals 0.0.0.0 binden.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wiki:${POSTGRES_PASSWORD}@db:5432/wiki
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Zugriff von außen läuft über den Cloudflare-Tunnel, nicht direkt.
      - "127.0.0.1:8080:8000"

  # Einmal-Job: docker compose run --rm ingest
  ingest:
    build: ./app
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wiki:${POSTGRES_PASSWORD}@db:5432/wiki
      VAULT_PATH: /vault
    volumes:
      - ./vault:/vault:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "ingest.py"]

volumes:
  pgdata:
